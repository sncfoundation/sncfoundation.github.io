<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Sheet-Native Computing Foundation logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a7f37"/><stop offset="1" stop-color="#0d5222"/>
    </linearGradient>
    <linearGradient id="poo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6b3f"/><stop offset="1" stop-color="#6b4420"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="112" height="112" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <!-- faint spreadsheet grid -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.4">
    <line x1="30" y1="20" x2="30" y2="100"/><line x1="60" y1="20" x2="60" y2="100"/><line x1="90" y1="20" x2="90" y2="100"/>
    <line x1="20" y1="40" x2="100" y2="40"/><line x1="20" y1="60" x2="100" y2="60"/><line x1="20" y1="80" x2="100" y2="80"/>
  </g>
  <!-- poop pile (vector, rasterizes cleanly) -->
  <g>
    <ellipse cx="60" cy="92" rx="31" ry="15" fill="url(#poo)"/>
    <ellipse cx="60" cy="74" rx="24" ry="14" fill="url(#poo)"/>
    <ellipse cx="60" cy="58" rx="17" ry="12" fill="url(#poo)"/>
    <ellipse cx="60" cy="46" rx="9"  ry="8"  fill="url(#poo)"/>
    <!-- eyes -->
    <ellipse cx="53" cy="70" rx="5.4" ry="6.2" fill="#ffffff"/>
    <ellipse cx="67" cy="70" rx="5.4" ry="6.2" fill="#ffffff"/>
    <circle cx="53" cy="71" r="2.6" fill="#1a1a1a"/>
    <circle cx="67" cy="71" r="2.6" fill="#1a1a1a"/>
  </g>
</svg>

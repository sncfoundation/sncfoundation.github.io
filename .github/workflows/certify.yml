name: Issue SNCF credential

# Turns a `certification` issue into an exam credential, or a `rank` issue into a rank
# credential (evaluated from the registry). The concurrency group serializes runs so the
# per-program serial counters are race-free.

on:
  issues:
    types: [opened]

permissions:
  contents: write   # commit the registry to master (Pages source)
  issues: write     # comment on and close the request

concurrency:
  group: csfe-registry
  cancel-in-progress: false

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'certification') || contains(github.event.issue.labels.*.name, 'rank')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      HOLDER: ${{ github.event.issue.user.login }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve latest release tag
        id: rel
        run: echo "tag=$(gh release view --json tagName -q .tagName 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Issue exam credential
        if: contains(github.event.issue.labels.*.name, 'certification')
        run: node .github/scripts/issue-credential.mjs
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}

      - name: Evaluate and award rank
        if: contains(github.event.issue.labels.*.name, 'rank')
        run: node .github/scripts/issue-rank.mjs
